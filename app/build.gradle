apply plugin: 'com.android.application'

android {
    namespace 'com.thephoenixit.onlineanimemusic'
    compileSdkVersion 34
    defaultConfig {
        manifestPlaceholders = [onesignal_app_id               : "878107db-b014-409e-89e3-267920f0d972",
                                onesignal_google_project_number: 'REMOTE']

        applicationId "com.thephoenixit.onlineanimemusic"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.onesignal:OneSignal:5.10.2'
    implementation 'com.google.android.gms:play-services-base:18.11.1'
    implementation 'com.google.firebase:firebase-ads:23.6.0'
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
}
